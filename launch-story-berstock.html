<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Launch Story — berstock.id</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px;
    height: 1920px;
    background: #0a0e1a;
    font-family: 'SF Pro Display', -apple-system, system-ui, sans-serif;
    color: #fff;
    overflow: hidden;
    position: relative;
  }
  body::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(233, 30, 99, 0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(233, 30, 99, 0.05) 1px, transparent 1px);
    background-size: 80px 80px;
    z-index: 0;
  }
  body::after {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 20% 15%, rgba(233, 30, 99, 0.3) 0%, transparent 35%),
      radial-gradient(circle at 80% 85%, rgba(212, 175, 55, 0.25) 0%, transparent 35%);
    z-index: 1;
  }
  .frame {
    position: relative;
    z-index: 2;
    width: 100%;
    height: 100%;
    padding: 130px 80px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 18px;
    margin-bottom: 60px;
  }
  .brand-emoji {
    width: 72px; height: 72px;
    background: linear-gradient(135deg, #d4af37, #f4cf67);
    border-radius: 18px;
    display: flex; align-items: center; justify-content: center;
    font-size: 42px;
    box-shadow: 0 4px 24px rgba(212, 175, 55, 0.4);
  }
  .brand-text {
    font-size: 38px;
    font-weight: 800;
    letter-spacing: -1px;
  }
  .brand-text .accent { color: #e91e63; }

  .badge-launch {
    background: linear-gradient(135deg, #e91e63, #d81b60);
    color: #fff;
    padding: 18px 40px;
    border-radius: 999px;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    box-shadow: 0 8px 32px rgba(233, 30, 99, 0.5);
    margin-bottom: 80px;
  }

  .hero-emoji {
    font-size: 200px;
    margin-bottom: 30px;
    filter: drop-shadow(0 0 60px rgba(212, 175, 55, 0.5));
  }

  .main-headline {
    font-size: 160px;
    font-weight: 900;
    line-height: 0.95;
    letter-spacing: -4px;
    margin-bottom: 50px;
    background: linear-gradient(135deg, #fff 0%, #e91e63 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .url-display {
    font-family: 'JetBrains Mono', monospace;
    font-size: 110px;
    font-weight: 900;
    letter-spacing: -3px;
    margin-bottom: 70px;
    background: linear-gradient(135deg, #d4af37 0%, #e91e63 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-shadow: 0 0 100px rgba(233, 30, 99, 0.4);
  }
  .url-display .dot { color: #fff; -webkit-text-fill-color: #fff; }

  .tagline {
    font-size: 50px;
    font-weight: 600;
    color: #e2e8f0;
    line-height: 1.25;
    margin-bottom: 80px;
    padding: 0 40px;
  }
  .tagline .highlight {
    color: #d4af37;
    font-weight: 800;
  }

  .cta-box {
    background: rgba(233, 30, 99, 0.1);
    border: 2px solid rgba(233, 30, 99, 0.3);
    border-radius: 30px;
    padding: 50px 60px;
    margin-top: auto;
    backdrop-filter: blur(20px);
  }
  .cta-text {
    font-size: 42px;
    font-weight: 700;
    color: #fff;
    margin-bottom: 16px;
  }
  .cta-sub {
    font-size: 32px;
    color: #cbd5e1;
    font-weight: 500;
  }
  .cta-sub strong { color: #d4af37; }

  .footer {
    margin-top: 60px;
    color: #94a3b8;
    font-size: 26px;
  }
  .footer strong { color: #fff; }
</style>
</head>
<body>
  <div class="frame">
    <div class="brand">
      <div class="brand-emoji">🐻</div>
      <div class="brand-text">berstock<span class="accent">.id</span></div>
    </div>

    <div class="badge-launch">🚀 NOW LIVE</div>

    <div class="hero-emoji">🎉</div>
    <div class="main-headline">SEKARANG<br>LIVE!</div>
    <div class="url-display">berstock<span class="dot">.</span>id</div>

    <div class="tagline">
      <span class="highlight">POS Pintar + AI Assistant</span><br>
      pertama di Indonesia 🇮🇩
    </div>

    <div class="cta-box">
      <div class="cta-text">👆 Swipe Up untuk Cek</div>
      <div class="cta-sub">DM <strong>@berstock.ai</strong> untuk demo gratis</div>
    </div>

    <div class="footer">
      🤖 Powered by <strong>Claude Sonnet 4.6</strong>
    </div>
  </div>
</body>
</html>
