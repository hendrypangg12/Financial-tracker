name: Deploy Berstock Bot

on:
  push:
    branches:
      - main
      - claude/financial-tracking-app-QUmrz
    paths:
      - 'bot/**'
      - '.github/workflows/deploy-bot.yml'
  workflow_dispatch:  # manual trigger dari GitHub UI

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Cloudflare Workers
    defaults:
      run:
        working-directory: bot
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: bot/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Notify success
        if: success()
        run: echo "✅ Berstock bot deployed — https://berstock-bot.hendrypangg12.workers.dev"
